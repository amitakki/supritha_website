# /etc/nginx/sites-available/suprithanalwad.in
server {
    listen 80;
    listen [::]:80;
    server_name suprithanalwad.in www.suprithanalwad.in;
    return 301 https://suprithanalwad.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.suprithanalwad.in;
    # certbot fills in the ssl_certificate lines
    return 301 https://suprithanalwad.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name suprithanalwad.in;

    root /var/www/suprithanalwad.in/public;
    index index.html;

    # certbot fills in ssl_certificate / ssl_certificate_key here

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/submit {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
